<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelRecommend Catalogue</title>
    <style>
        body { font-family: sans-serif; background-color: #141414; color: white; text-align: center; padding: 50px; }
        .card { background: #222; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        h1 { color: #E50914; }
        button { background: #E50914; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎬 ReelRecommend</h1>
        <p>Welcome to your movie & TV-show recommendation catalogue!</p>
        <p>Choose genres, search titles, and build your watchlist.</p>
        <button onclick="alert('Looking for recommendations!')">Browse Movies</button>
    </div>
</body>
</html>
